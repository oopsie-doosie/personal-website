    <!-- Visitors who picked another edition (retro game or newspaper) get a
         black screen instead of a flash of the prerendered modern page while it
         loads, and anyone who has switched before gets a calm navbar toggle
         (src/theme/siteTheme.ts) -->
    <style>html.edition-boot,html.edition-boot body{background:#000}html.edition-boot #root{visibility:hidden}</style>
    <script>
      try {
        var savedTheme = localStorage.getItem("site-theme");
        if (savedTheme) document.documentElement.classList.add("retro-seen");
        var edition = new URLSearchParams(location.search).get("theme") || savedTheme;
        if (edition === "retro" || edition === "paper") {
          document.documentElement.classList.add("edition-boot");
          setTimeout(function () { document.documentElement.classList.remove("edition-boot"); }, 6000);
        }
      } catch (e) {}
    </script>
